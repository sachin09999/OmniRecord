name: Build and Deploy OmniRecord

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build verification
        run: npm run build

  deploy-remote:
    name: Deploy to Remote Server / PC
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Remote Machine
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.REMOTE_TARGET || '~/OmniRecord' }}"
            
            # Clone if repository does not exist on remote machine
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Cloning repository on remote machine..."
              git clone https://github.com/sachin09999/OmniRecord.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "Fetching and pulling latest commits from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and restarting Docker container on port 8877..."
            docker compose down || true
            docker compose up -d --build

            echo "OmniRecord deployed successfully! Accessible at http://${{ secrets.REMOTE_HOST }}:8877/"
