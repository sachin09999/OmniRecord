name: Build and Deploy OmniRecord

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build verification
        run: npm run build

  deploy-self-hosted:
    name: Deploy on Local Server (Self-Hosted Runner)
    needs: build-test
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and restart Docker container
        run: |
          docker compose down || true
          docker compose up -d --build
          echo "OmniRecord deployed successfully on local server!"
