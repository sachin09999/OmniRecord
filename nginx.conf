server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTML5 SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy configuration for Cupola API /1/ endpoints (recordings, video stream, thumbnail)
    location /1/ {
        proxy_pass http://10.10.12.50:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host 10.10.12.50:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy configuration for Cupola API /2/ endpoints (plant metadata)
    location /2/ {
        proxy_pass http://10.10.12.50:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host 10.10.12.50:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy configuration for Cupola /static/ assets (render files, thumbnails)
    location /static/ {
        proxy_pass http://10.10.12.50:3000;
        proxy_http_version 1.1;
        proxy_set_header Host 10.10.12.50:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy configuration for WebRTC signaling to go2rtc
    location /api/webrtc {
        proxy_pass http://go2rtc:1984;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static Asset Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
